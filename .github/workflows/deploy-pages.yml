name: Deploy Site

# The root site is static, so it only needs rebuilding when this repository
# changes. The two nested tools are mirrored from the Pages sites that their
# own repositories already publish:
#
#   kingshot/map/              <- roberthewitt/kingshot-discord-updates
#   kingshot/troop-calculator/ <- roberthewitt/kingshot-bear-troop-calc
#
# Either repository can notify this one the moment it finishes publishing, by
# dispatching this workflow with the build it just put live. See the README
# for the snippet and the token it needs. The schedule below stays on as a
# safety net, because a push-based trigger is silent when it breaks: a revoked
# or expired token stops the notifications without failing anything, and
# without a periodic run the site would simply stop updating unnoticed.
#
# The schedule cannot be chained to the source's nominal 05:30 publish.
# GitHub defers scheduled runs under load, and that repository's "05:30" job
# has actually started between 10:32 and 12:30 UTC on recent days. This
# workflow's own schedule is deferred by the same unpredictable amount, so any
# single daily slot is as likely to run before that day's publish as after it,
# and would then mirror the previous day's map for a full day. Polling on a
# fixed interval sidesteps the ordering question instead of trying to win the
# race, and bounds staleness to roughly six hours on its own.
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      expected_version:
        description: >-
          Dataset version to wait for before mirroring the map, as reported by
          the map repository's publish job. Leave blank to mirror whatever is
          currently published.
        required: false
        type: string
      expected_calculator_build:
        description: >-
          Next.js build id to wait for before mirroring the troop calculator,
          as found in that repository's .next/BUILD_ID. Leave blank to mirror
          whatever is currently published.
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Pages keeps a single live deployment. Let a newer run supersede one that is
# still queued, but never cancel a deployment already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The map's own public Pages site, which is the published output of
  # `npm run map:build` in roberthewitt/kingshot-discord-updates.
  MAP_SOURCE_URL: https://roberthewitt.github.io/kingshot-discord-updates/

  # The troop calculator's own public Pages site, which is the published
  # `next build` export from roberthewitt/kingshot-bear-troop-calc.
  CALC_SOURCE_URL: https://roberthewitt.github.io/kingshot-bear-troop-calc/
  # The base path that export was built against, and the one it is served
  # from here. Both are written without a trailing slash because the base
  # appears in both forms in the bundle.
  CALC_SOURCE_BASE: /kingshot-bear-troop-calc
  CALC_DEST_BASE: /kingshot/troop-calculator

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Site Repository
        uses: actions/checkout@v4

      # Both tools are copied from their published sites rather than rebuilt
      # from source. Their repositories are private, so this workflow's
      # GITHUB_TOKEN cannot check them out. Reading the public bundles instead
      # needs no credential, and can only ever serve what those repositories
      # themselves chose to publish.
      #
      # The map is built by vite with `base: './'`, so every reference in it
      # is relative and keeps resolving once it is served from /kingshot/map/
      # instead of the site root. The calculator is not so lucky; see its own
      # step below.
      - name: Await Published Version
        if: ${{ inputs.expected_version != '' }}
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail

          # GitHub Pages serves through a CDN with `cache-control: max-age=600`,
          # and that cache honours neither a cache-busting query string nor a
          # no-cache request header. So being told the source has deployed is
          # not the same as being able to read the new bundle: for up to ten
          # minutes the edge can still hand back the previous one. Mirroring
          # immediately on notification would therefore reliably copy stale
          # files and then sit on them until the next scheduled run.
          #
          # Waiting for the version the source says it published turns that
          # race into a non-issue, without having to guess a sleep that is
          # long enough.
          deadline=$(( $(date +%s) + 900 ))

          while :; do
            if curl -fsSL -o probe.json "${MAP_SOURCE_URL}players.json"; then
              published="$(node -p "JSON.parse(require('fs').readFileSync('probe.json','utf8')).version?.label ?? ''")"
            else
              published=''
            fi

            if [[ "${published}" == "${EXPECTED_VERSION}" ]]; then
              echo "Published map is serving \`${EXPECTED_VERSION}\`." | tee -a "$GITHUB_STEP_SUMMARY"
              break
            fi

            if [[ "$(date +%s)" -ge "${deadline}" ]]; then
              echo "Timed out waiting for ${EXPECTED_VERSION}; the published map still reports '${published:-nothing}'" >&2
              echo "The CDN cache should expire well inside this window, so this suggests the publish did not land." >&2
              exit 1
            fi

            echo "Published map reports '${published:-nothing}', waiting for ${EXPECTED_VERSION}"
            sleep 30
          done

          rm -f probe.json

      - name: Mirror Kingshot Map
        run: |
          set -euo pipefail

          dest="_site/kingshot/map"
          mkdir -p "${dest}"

          curl -fsSL --retry 3 --retry-delay 5 -o "${dest}/index.html" "${MAP_SOURCE_URL}"

          # Discover the hashed asset filenames instead of hardcoding them,
          # since they change on every rebuild of the map.
          grep -oE '(src|href)="\./[^"]+"' "${dest}/index.html" \
            | sed -E 's/.*"\.\/([^"]+)"/\1/' \
            | sort -u > assets.txt

          if [[ ! -s assets.txt ]]; then
            echo "Found no relative assets in the published map, so it was probably an error page" >&2
            exit 1
          fi

          while read -r asset; do
            mkdir -p "${dest}/$(dirname "${asset}")"
            curl -fsSL --retry 3 --retry-delay 5 -o "${dest}/${asset}" "${MAP_SOURCE_URL}${asset}"
          done < assets.txt

          # Fetched separately because the map requests it at runtime rather
          # than referencing it from the markup.
          curl -fsSL --retry 3 --retry-delay 5 -o "${dest}/players.json" "${MAP_SOURCE_URL}players.json"

          while read -r asset; do
            if [[ ! -s "${dest}/${asset}" ]]; then
              echo "Mirrored ${asset} is missing or empty" >&2
              exit 1
            fi
          done < <(cat assets.txt; printf 'players.json\nindex.html\n')

          rm assets.txt

          # A map that renders with no players is a silent failure, so treat
          # an unusable dataset as a failed build.
          player_count="$(node -p "require('./${dest}/players.json').players.length")"
          if [[ "${player_count}" -eq 0 ]]; then
            echo "The mirrored dataset contains no players" >&2
            exit 1
          fi

          dataset_version="$(node -p "require('./${dest}/players.json').version?.label ?? 'unknown'")"
          echo "Mirrored map: ${player_count} players (\`${dataset_version}\`)." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Await Published Calculator Build
        if: ${{ inputs.expected_calculator_build != '' }}
        env:
          EXPECTED_BUILD: ${{ inputs.expected_calculator_build }}
        run: |
          set -euo pipefail

          # Same CDN caching problem as the map above: being told the
          # calculator has deployed does not mean the edge will serve the new
          # bundle yet. Next stamps each build with an id, so that is what we
          # wait for.
          deadline=$(( $(date +%s) + 900 ))

          while :; do
            if curl -fsSL -o probe.html "${CALC_SOURCE_URL}"; then
              # Read from the raw bytes, since the id sits inside JSON that is
              # itself escaped into the HTML.
              published="$(grep -oE 'buildId[^A-Za-z0-9_-]+[A-Za-z0-9_-]+' probe.html \
                | head -n1 | grep -oE '[A-Za-z0-9_-]+$' || true)"
            else
              published=''
            fi

            if [[ "${published}" == "${EXPECTED_BUILD}" ]]; then
              echo "Published calculator is serving \`${EXPECTED_BUILD}\`." | tee -a "$GITHUB_STEP_SUMMARY"
              break
            fi

            if [[ "$(date +%s)" -ge "${deadline}" ]]; then
              echo "Timed out waiting for ${EXPECTED_BUILD}; the published calculator still reports '${published:-nothing}'" >&2
              echo "The CDN cache should expire well inside this window, so this suggests the publish did not land." >&2
              exit 1
            fi

            echo "Published calculator reports '${published:-nothing}', waiting for ${EXPECTED_BUILD}"
            sleep 30
          done

          rm -f probe.html

      - name: Mirror Troop Calculator
        run: |
          set -euo pipefail

          dest="_site/kingshot/troop-calculator"
          mkdir -p "${dest}"

          # The calculator is a Next.js static export built with
          # `basePath: '/kingshot-bear-troop-calc'`, so unlike the map every
          # reference in it is an absolute path rooted at that base. Mirroring
          # it therefore means rewriting the base as well as copying files.
          for doc in index.html 404.html index.txt; do
            curl -fsSL --retry 3 --retry-delay 5 -o "${dest}/${doc}" "${CALC_SOURCE_URL}${doc}"
          done

          if ! grep -q '_next/static' "${dest}/index.html"; then
            echo "The published calculator has no _next assets, so it was probably an error page" >&2
            exit 1
          fi

          # Assets named directly in the documents.
          grep -ohE "${CALC_SOURCE_BASE}/_next/[A-Za-z0-9/._-]+" \
            "${dest}/index.html" "${dest}/404.html" "${dest}/index.txt" \
            | sed "s|^${CALC_SOURCE_BASE}/||" \
            | sort -u > assets.txt

          # Chunks that webpack only requests at runtime. These are built as
          # "static/chunks/" + id + "." + hash + ".js" from a table inside the
          # runtime, so they appear in no document, and a mirror that only
          # scraped the markup would omit them and break the calculator the
          # moment a lazy import ran.
          webpack="$(grep -oE '_next/static/chunks/webpack-[A-Za-z0-9]+\.js' "${dest}/index.html" | head -n1)"
          if [[ -z "${webpack}" ]]; then
            echo "Could not find the webpack runtime in the published calculator" >&2
            exit 1
          fi
          mkdir -p "${dest}/$(dirname "${webpack}")"
          curl -fsSL --retry 3 --retry-delay 5 -o "${dest}/${webpack}" "${CALC_SOURCE_URL}${webpack}"

          node -e '
            const fs = require("fs");
            const runtime = fs.readFileSync(process.argv[1], "utf8");
            const table = runtime.match(/"static\/chunks\/"\+\w+\+"\."\+\(([^)]*)\)/);
            if (!table) {
              console.error("The webpack runtime does not expose a lazy chunk table in the shape this mirror understands.");
              console.error("Next.js may have changed its runtime; the mirror must be rechecked rather than silently shipping a partial copy.");
              process.exit(1);
            }
            const names = [...table[1].matchAll(/(\w+):"([0-9a-f]+)"/g)]
              .map(([, id, hash]) => `_next/static/chunks/${id}.${hash}.js`);
            if (names.length === 0) {
              console.error("Found a lazy chunk table but no chunks in it");
              process.exit(1);
            }
            console.log(names.join("\n"));
          ' "${dest}/${webpack}" >> assets.txt

          sort -u -o assets.txt assets.txt

          while read -r asset; do
            mkdir -p "${dest}/$(dirname "${asset}")"
            curl -fsSL --retry 3 --retry-delay 5 -o "${dest}/${asset}" "${CALC_SOURCE_URL}${asset}"
          done < assets.txt

          while read -r file; do
            if [[ ! -s "${dest}/${file}" ]]; then
              echo "Mirrored ${file} is missing or empty" >&2
              exit 1
            fi
          done < <(cat assets.txt; printf 'index.html\n404.html\nindex.txt\n')

          # Point every absolute reference at the path this site serves the
          # calculator from. The base appears in the markup, in the webpack
          # asset prefix and in the router's own copy of it, both with and
          # without a trailing slash, so it is rewritten everywhere rather
          # than only in the documents.
          while read -r file; do
            case "${file}" in
              *.html|*.js|*.css|*.txt|*.json|*.map)
                perl -pi -e "s{\Q${CALC_SOURCE_BASE}\E}{${CALC_DEST_BASE}}g" "${dest}/${file}"
                ;;
            esac
          done < <(cd "${dest}" && find . -type f | sed 's|^\./||')

          if grep -rq "kingshot-bear-troop-calc" "${dest}"; then
            echo "The mirrored calculator still refers to its original base path" >&2
            grep -rl "kingshot-bear-troop-calc" "${dest}" >&2
            exit 1
          fi

          # Every asset the mirrored markup asks for must exist in the mirror,
          # or the calculator will 404 at runtime on a path this site does not
          # host.
          missing=0
          while read -r ref; do
            rel="${ref#${CALC_DEST_BASE}/}"
            if [[ ! -f "${dest}/${rel}" ]]; then
              echo "Mirrored markup references ${ref} which was not copied" >&2
              missing=1
            fi
          done < <(grep -rhoE "${CALC_DEST_BASE}/_next/[A-Za-z0-9/._-]+" "${dest}" | sort -u)
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

          asset_count="$(wc -l < assets.txt | tr -d ' ')"
          rm assets.txt
          echo "Mirrored troop calculator: ${asset_count} assets rebased onto \`${CALC_DEST_BASE}/\`." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Assemble Pages Artifact
        run: |
          set -euo pipefail

          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            ./ _site/
          touch _site/.nojekyll

          for required in _site/index.html _site/assets/styles.css \
            _site/kingshot/map/index.html \
            _site/kingshot/troop-calculator/index.html; do
            if [[ ! -f "${required}" ]]; then
              echo "Missing ${required} in the assembled artifact" >&2
              exit 1
            fi
          done

          # Absolute references would resolve against the site root and break
          # the map now that it is served from a nested path.
          if grep -qE '(src|href)="/' _site/kingshot/map/index.html; then
            echo "The map bundle references absolute paths and will break under /kingshot/map/" >&2
            exit 1
          fi

          # The calculator's references are absolute by design, so the check
          # there is that they were rebased onto the path we serve it from.
          if grep -oE '(src|href)="/[^"]*"' _site/kingshot/troop-calculator/index.html \
            | grep -v "\"${CALC_DEST_BASE}/" > stray.txt; then
            echo "The calculator references absolute paths outside ${CALC_DEST_BASE}/" >&2
            cat stray.txt >&2
            exit 1
          fi
          rm -f stray.txt

          echo "Assembled root page, the Kingshot map at \`kingshot/map/\` and the troop calculator at \`kingshot/troop-calculator/\`." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy Site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
